version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates are handled manually; security updates still apply.
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Version updates are handled manually; security updates still apply.
    open-pull-requests-limit: 0
