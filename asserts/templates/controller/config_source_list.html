<div class="cfg-sources">
  <h2>{{ global_stuff['get_text']('Source configuration') | safe }}</h2>
  <p class="setting-desc">{{ global_stuff['get_text']('Choose a source to configure') | safe }} ({{ config_source_list | length }} {{ global_stuff['get_text']('sources with individual settings') | safe }})</p>
  <div class="source-pick">
    <select id="config_source_list" placeholder="" autocomplete="off">
      <option value="">Choose a source ...</option>
      {% for source in source_list %}
        <option value="{{ source }}">{{ source }}</option>
      {% endfor %}
    </select>
    <button type="button" class="btn" id="edit_source_config"><span class="codicon codicon-edit"></span>{{ global_stuff['get_text']('Edit') | safe }}</button>
    <button type="button" class="btn secondary" id="delete_source_config"><span class="codicon codicon-trash"></span>{{ global_stuff['get_text']('Delete') | safe }}</button>
  </div>
</div>
