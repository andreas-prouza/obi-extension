<!DOCTYPE html>
<html lang="en">

<head>
  {% include "tools/csp.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ global_stuff['styleUri'] }}">
  <link rel="stylesheet" href="{{ global_stuff['vendor_uri'] }}/codicons/codicon.css">
  <link rel="stylesheet" href="{{ global_stuff['ui_style_uri'] }}">
</head>

<body class="obi-page obi-view">

{% for setting in config_settings_attributes %}
  <div class="setting">
    <div class="setting-label"><label for="{{ setting.name }}">{{ setting.name }}</label><span class="setting-tag">{{ setting.type }}</span></div>
    <input class="obi-input" type="text" id="{{ setting.name }}" name="{{ setting.name }}" value="{{ setting.value }}">
  </div>
{% endfor %}

  <script type="module" nonce="{{ global_stuff['nonce'] }}" src="{{ main_java_script }}"></script>

</body>

</html>
